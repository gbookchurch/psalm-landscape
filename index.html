<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你現在的光景，適合讀哪篇詩篇？｜教會小本本</title>
<meta name="description" content="20 個關於「最近」的問題，陪你找到一篇可以慢慢讀的詩篇。">
<meta name="theme-color" content="#FAF4E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要內容</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .10 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
    </filter>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main id="main" tabindex="-1">

  <!-- 首頁 -->
  <section id="view-home" class="view" data-view="home" hidden>
    <div class="hero" id="hero" aria-hidden="true">
      <svg class="hero-art" viewBox="0 0 400 330" preserveAspectRatio="xMidYMax meet" role="presentation" focusable="false">
        <g class="sky-dots">
          <circle cx="62" cy="58" r="3" fill="#E8BE65"/><circle cx="330" cy="40" r="2.4" fill="#DC9551"/>
          <circle cx="300" cy="96" r="1.8" fill="#78945A"/><circle cx="96" cy="120" r="2" fill="#C9684B"/>
          <circle cx="210" cy="26" r="2.2" fill="#78945A"/>
        </g>
        <!-- 攤開的書（底） -->
        <g class="book" filter="url(#paper)">
          <path d="M40 268 Q120 246 200 262 Q280 246 360 268 L360 292 Q280 272 200 290 Q120 272 40 292 Z" fill="#C9684B"/>
          <path class="page-l" d="M52 262 Q124 240 200 256 L200 284 Q124 266 52 286 Z" fill="#FFFDF7"/>
          <path class="page-r" d="M348 262 Q276 240 200 256 L200 284 Q276 266 348 286 Z" fill="#FFFDF7"/>
          <path d="M200 256 L200 288" stroke="#E7D8BE" stroke-width="1.5"/>
          <g stroke="#EADFCB" stroke-width="1" fill="none">
            <path d="M70 270 Q130 254 190 266"/><path d="M76 277 Q132 262 190 273"/>
            <path d="M330 270 Q270 254 210 266"/><path d="M324 277 Q268 262 210 273"/>
          </g>
        </g>
        <!-- 書頁升起的地景，由後到前 -->
        <g class="layer l1" filter="url(#paper)">
          <path d="M60 258 C90 190 130 170 160 200 C180 150 230 128 262 176 C290 150 330 170 344 258 Z" fill="#E8BE65"/>
        </g>
        <g class="layer l2" filter="url(#paper)">
          <!-- 向上流進天空的河 -->
          <path d="M196 256 C176 214 236 196 214 150 C196 112 250 92 236 46" fill="none" stroke="#DC9551" stroke-width="14" stroke-linecap="round"/>
          <path d="M196 256 C176 214 236 196 214 150 C196 112 250 92 236 46" fill="none" stroke="#FAF4E8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
          <ellipse cx="236" cy="40" rx="34" ry="12" fill="#FFFDF7"/>
        </g>
        <g class="layer l3" filter="url(#paper)">
          <!-- 紙摺成的台地與階梯 -->
          <path d="M84 258 L84 214 L104 214 L104 198 L124 198 L124 182 L150 182 L150 258 Z" fill="#C9684B"/>
          <path d="M150 258 L150 182 L162 190 L162 258 Z" fill="#A9523A"/>
        </g>
        <g class="layer l4" filter="url(#paper)">
          <!-- 一片葉子長成的樹 -->
          <path d="M292 258 C268 220 270 160 300 120 C332 160 334 220 306 258 Z" fill="#78945A"/>
          <path d="M299 252 L300 128" stroke="#5F7A45" stroke-width="2.2"/>
          <path d="M300 170 L284 156 M300 196 L318 182 M300 220 L286 208" stroke="#5F7A45" stroke-width="1.6"/>
        </g>
        <g class="layer l5" filter="url(#paper)">
          <path d="M40 262 Q110 236 170 252 Q120 270 40 274 Z" fill="#A6B98A"/>
          <path d="M360 262 Q300 238 236 254 Q290 270 360 274 Z" fill="#E3C98E"/>
        </g>
      </svg>
    </div>

    <div class="home-copy wrap">
      <p class="brand-mark">教會小本本</p>
      <h1 class="home-title">你現在的光景，<br>適合讀哪篇詩篇？</h1>
      <p class="home-sub" data-copy="homeSub"></p>
      <ul class="home-facts">
        <li>約 5–8 分鐘</li>
        <li>每題都可以略過</li>
        <li>作答只在你的裝置上計算</li>
      </ul>
      <div class="home-actions">
        <button class="btn btn-primary" id="btn-start" type="button">開始探索</button>
        <button class="btn btn-quiet" id="btn-resume" type="button" hidden>繼續上次的作答</button>
      </div>
      <p class="fine" data-copy="disclaimer"></p>
    </div>
  </section>

  <!-- 答題 -->
  <section id="view-quiz" class="view" data-view="quiz" hidden>
    <div class="wrap quiz">
      <div class="quiz-top">
        <button class="btn-text" id="btn-prev" type="button">上一題</button>
        <p class="quiz-count" id="quiz-count" aria-live="polite"></p>
        <button class="btn-text" id="btn-home" type="button">離開</button>
      </div>
      <div class="progress" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="20" id="progress"><span id="progress-bar"></span></div>
      <h2 class="q-text" id="q-text" tabindex="-1"></h2>
      <div class="options" id="options" role="group" aria-labelledby="q-text"></div>
      <button class="btn-skip" id="btn-skip" type="button"></button>
      <p class="fine kbd-hint">鍵盤：按 1–4 選擇，0 略過，← 回上一題</p>
    </div>
  </section>

  <!-- 資訊不足 -->
  <section id="view-insufficient" class="view" data-view="insufficient" hidden>
    <div class="wrap narrow">
      <h2 class="section-title" tabindex="-1">還差一點資訊</h2>
      <p>目前回答到的面向少於五個，還不足以找出適合的詩篇。可以回去補答幾題，被略過的題目都還在。</p>
      <div class="home-actions">
        <button class="btn btn-primary" id="btn-back-fill" type="button">回去補答</button>
        <button class="btn btn-quiet" id="btn-restart-ins" type="button">重新開始</button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="view-result" class="view" data-view="result" hidden>
    <div class="wrap result" id="result-root"></div>
  </section>

  <!-- 經文閱讀 -->
  <section id="view-read" class="view" data-view="read" hidden>
    <div class="reader-bar">
      <div class="wrap reader-bar-inner">
        <button class="btn-text" id="btn-read-back" type="button">返回結果</button>
        <div class="reader-tools" role="group" aria-label="閱讀設定">
          <button class="tool" id="font-dec" type="button" aria-label="縮小字級">A−</button>
          <button class="tool" id="font-inc" type="button" aria-label="放大字級">A＋</button>
          <button class="tool" id="toggle-vnum" type="button" aria-pressed="true">節數</button>
        </div>
      </div>
    </div>
    <article class="wrap narrow reader" id="reader"></article>
  </section>

</main>

<!-- 分享卡 -->
<div class="sheet" id="share-sheet" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="share-title">分享我的生命光景</h2>
      <button class="btn-text" id="share-close" type="button">關閉</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="樣式">
      <button type="button" role="radio" aria-checked="true" data-style="scene">風景版</button>
      <button type="button" role="radio" aria-checked="false" data-style="data">數據版</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="比例">
      <button type="button" role="radio" aria-checked="true" data-ratio="story">限時動態 9:16</button>
      <button type="button" role="radio" aria-checked="false" data-ratio="post">貼文 4:5</button>
    </div>
    <p class="fine" id="share-note">分享圖只包含詩篇與光景，不會出現你的作答內容。</p>
    <div class="share-preview"><canvas id="share-canvas" aria-label="分享圖預覽"></canvas></div>
    <div class="home-actions">
      <button class="btn btn-primary" id="share-save" type="button">儲存圖片</button>
      <button class="btn btn-quiet" id="share-native" type="button" hidden>分享到…</button>
    </div>
  </div>
</div>

<script src="data/config.js"></script>
<script src="data/copy.js"></script>
<script src="data/psalms.js"></script>
<script src="data/questions.js"></script>
<script src="data/scripture.js" defer></script>
<script src="js/scoring.js"></script>
<script src="js/art.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
