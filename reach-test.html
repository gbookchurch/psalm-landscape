<main class="wrap rt" style="max-width:860px">
  <h1>150 篇可選性測試</h1>
  <p class="fine">內部測試用，沒有連結到網站其他頁面。每一篇都附一組「會配到這一篇」的作答，打開這頁時會用網站目前的計分程式重新驗算一次，所以之後改了題目或座標，這裡也會即時反映。</p>
  <p class="fine">按「看結果」會用那組作答直接打開結果頁，<b>會蓋掉你這個瀏覽器裡正在進行的測驗作答</b>（「我的詩篇」也會多一筆紀錄）。</p>
  <div class="sum" id="sum"></div>
  <div class="filter" role="group" aria-label="篩選">
    <button type="button" data-f="all" aria-pressed="true">全部</button>
    <button type="button" data-f="bad" aria-pressed="false">只看選不到的</button>
    <button type="button" data-f="rare" aria-pressed="false">只看很少出現的（低於 0.1%）</button>
  </div>
  <table>
    <thead><tr><th>篇</th><th>短標題／光景</th><th>驗算</th><th class="hide-s">自然出現機率</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="fine" style="margin-top:18px">「自然出現機率」是模擬 20 萬位「各面向有自己的位置、答題前後一致」的使用者，配到這一篇的比例（2026-11-18，web-0.18 的題目與座標）。這個數字不會自動更新。</p>
</main>

      <td class="hide-s">${(x.nat * 100).toFixed(x.nat < 0.01 ? 3 : 1)}%</td>
      <td>${x.a ? `<button class="go" type="button" data-n="${x.p.psalm}">看結果</button>` : ''}</td>
    </tr>`).join('');
    document.querySelectorAll('.go').forEach((b) => (b.onclick = () => {
      localStorage.setItem('psalm-quiz-v1', JSON.stringify({ answers: DATA.answers[b.dataset.n], step: Q.length - 1, done: true }));
      location.href = 'index.html#/result';
    }));
  }
  document.querySelectorAll('.filter button').forEach((b) => (b.onclick = () => {
    document.querySelectorAll('.filter button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    render(b.dataset.f);
  }));
  render('all');
})();
</script>
</body>
</html>
